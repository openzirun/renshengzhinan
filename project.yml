name: LifeGuide
options:
  bundleIdPrefix: com.lifeguide
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LifeGuide:
    type: application
    platform: iOS
    sources: [LifeGuide]
    dependencies:
      - target: DailyReadingWidget
    entitlements:
      path: LifeGuide/LifeGuide.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lifeguide.ios]
    info:
      path: LifeGuide/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.lifeguide.article
            CFBundleURLSchemes: [lifeguide]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeguide.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 高性价比人生指南
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  DailyReadingWidget:
    type: app-extension
    platform: iOS
    sources:
      - DailyReadingWidget
      - LifeGuide/GuideContent.swift
      - LifeGuide/DailyReading.swift
      - LifeGuide/Localization.swift
      - path: LifeGuide/Resources
        group: LifeGuide
        excludes: [HowToLiveBetter.pdf]
    entitlements:
      path: DailyReadingWidget/DailyReadingWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lifeguide.ios]
    info:
      path: DailyReadingWidget/Info.plist
      properties:
        CFBundleDisplayName: 今日一读
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeguide.ios.dailyreading
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  LifeGuideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LifeGuideUITests]
    dependencies:
      - target: LifeGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LifeGuide:
    build:
      targets:
        LifeGuide: all
    test:
      targets: [LifeGuideUITests]
